<div class="section contact-section">

    <div class="section-heading">
        <p>Let's connect</p>
        <h2>Contact Me</h2>
    </div>


    <div class="contact-content">

        <!-- Contact information -->

        <div class="contact-text">

            <h3>Let's work together</h3>

            <p>
                Feel free to get in touch with me if you'd like to discuss
                a project, collaboration, opportunity, or simply connect.
            </p>


            <div class="contact-links">

                <a href="mailto:your-email@example.com">
                    Email
                </a>

                <a
                    href="https://github.com/esli-kalemi"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    GitHub
                </a>

                <a
                    href="https://www.linkedin.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    LinkedIn
                </a>

            </div>

        </div>


        <!-- Contact form -->

       <form class="contact-form" id="contactForm">

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your name"
                    autocomplete="name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="your@email.com"
                    autocomplete="email"
                    required
                >

                <p
                    class="field-error"
                    id="emailError"
                ></p>

            </div>
            


            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Your message..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="btn primary-btn"
            >
                Send Message
            </button>


            <p
                class="form-message"
                id="formMessage"
                aria-live="polite"
            ></p>

        </form>

    </div>

</div>
